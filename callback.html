<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connecting TikTok</title>
<style>body { font: 17px/1.6 system-ui, sans-serif; max-width: 720px; margin: 48px auto; padding: 0 16px; color: #111; background: #fff; }
a.btn { display: inline-block; background: #fe2c55; color: #fff; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 700; }</style>
</head>
<body>
<h1>Connecting TikTok</h1>
<p id="msg">Press the button to finish connecting the Price Tag Anatomy publishing tool on this computer.</p>
<p><a id="go" class="btn" href="#">Finish on this computer</a></p>
<script>
  var q = location.search;
  if (/[?&](code|error)=/.test(q)) {
    document.getElementById("go").href = "http://127.0.0.1:8773/tiktok/callback" + q;
  } else {
    document.getElementById("msg").textContent = "Nothing to do here. You can close this page.";
    document.getElementById("go").style.display = "none";
  }
</script>
</body>
</html>
